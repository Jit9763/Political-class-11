<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chapter 15 - NCERT Image Selector Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Noto+Sans+Devanagari:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0f172a;
            --card-dark: #1e293b;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --success: #10b981;
            --border: #334155;
        }

        body {
            font-family: 'Outfit', 'Noto Sans Devanagari', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            padding: 0;
        }

        header {
            background: linear-gradient(135deg, #1e3a8a, #0f172a);
            padding: 30px;
            border-bottom: 1px solid var(--border);
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        .header-title h1 {
            margin: 0;
            font-size: 24pt;
            font-weight: 800;
            background: linear-gradient(to right, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-title p {
            margin: 5px 0 0 0;
            color: var(--text-muted);
            font-size: 11pt;
        }

        .actions {
            display: flex;
            gap: 15px;
        }

        .btn {
            padding: 12px 24px;
            font-size: 12pt;
            font-weight: 600;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.15);
        }

        .btn-primary {
            background-color: var(--success);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(16, 185, 129, 0.4);
        }

        .btn-secondary {
            background-color: var(--accent);
            color: white;
        }

        .btn-secondary:hover {
            background-color: var(--accent-hover);
        }

        .container {
            max-width: 1400px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .filter-bar {
            background-color: var(--card-dark);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 30px;
            display: flex;
            gap: 20px;
            align-items: center;
            flex-wrap: wrap;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .filter-group label {
            font-size: 10pt;
            color: var(--text-muted);
            font-weight: 600;
        }

        .filter-group select, .filter-group input {
            background-color: var(--bg-dark);
            color: var(--text-main);
            border: 1px solid var(--border);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 11pt;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
            gap: 25px;
        }

        .card {
            background-color: var(--card-dark);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: all 0.2s ease;
        }

        .card.selected {
            border-color: var(--success);
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.2);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-title {
            font-weight: 700;
            font-size: 13pt;
        }

        .page-badge {
            background-color: var(--accent);
            color: white;
            font-size: 9pt;
            font-weight: 600;
            padding: 3px 8px;
            border-radius: 4px;
        }

        .img-container {
            width: 100%;
            height: 250px;
            background-color: #0b0f19;
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 1px solid var(--border);
        }

        .img-container img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .form-group label {
            font-size: 10pt;
            color: var(--text-muted);
            font-weight: 600;
        }

        .form-group textarea, .form-group select {
            background-color: var(--bg-dark);
            color: var(--text-main);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 8px 12px;
            font-family: inherit;
            font-size: 11pt;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 60px;
        }

        .context-box {
            background-color: #0b0f19;
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 10px;
            font-size: 9.5pt;
            color: var(--text-muted);
            max-height: 100px;
            overflow-y: auto;
            white-space: pre-wrap;
            font-family: monospace;
        }

        .checkbox-container {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            user-select: none;
            font-weight: 600;
        }

        .checkbox-container input {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }

        .status-message {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background-color: var(--success);
            color: white;
            padding: 15px 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            font-weight: 600;
            display: none;
            z-index: 1000;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from { transform: translateY(100px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-title">
            <h1>अध्याय 15 - NCERT चित्र चयन डैशबोर्ड</h1>
            <p>100% NCERT संरेखित चित्र और कस्टम विवरण चुनें</p>
        </div>
        <div class="actions">
            <button class="btn btn-secondary" onclick="selectAll(true)">सब चुनें</button>
            <button class="btn btn-secondary" onclick="selectAll(false)">सब हटाएं</button>
            <button class="btn btn-primary" onclick="saveSelection()">💾 बदलाव सुरक्षित करें (Save Selection)</button>
        </div>
    </header>

    <div class="container">
        <div class="filter-bar">
            <div class="filter-group">
                <label for="pageFilter">पेज नंबर फ़िल्टर:</label>
                <select id="pageFilter" onchange="applyFilters()">
                    <option value="all">सभी पेज</option>
                </select>
            </div>
            <div class="filter-group">
                <label for="statusFilter">स्थिति फ़िल्टर:</label>
                <select id="statusFilter" onchange="applyFilters()">
                    <option value="all">सभी</option>
                    <option value="selected">चयनित (Selected)</option>
                    <option value="unselected">गैर-चयनित (Unselected)</option>
                </select>
            </div>
            <div class="filter-group">
                <label for="searchBar">खोजें (Context Search):</label>
                <input type="text" id="searchBar" placeholder="टेक्स्ट खोजें..." oninput="applyFilters()">
            </div>
        </div>

        <div class="grid" id="imageGrid">
            <!-- Rendered dynamically -->
        </div>
    </div>

    <div class="status-message" id="statusMessage">✅ बदलाव सुरक्षित कर दिए गए हैं! copy_master_ch15.html अपडेट हो गया है।</div>

    <script>
        let allData = [];
        let selectedState = {}; // maps filename -> { selected, caption, part }

        // Define default mappings for known images to make it easy
        const defaultMappings = {
            'page_3_img_3.png': { selected: true, part: 'part3', caption: '<b>चित्र:</b> वित्त मंत्री मनमोहन सिंह और प्रधानमंत्री नरसिम्हा राव को नई आर्थिक नीति (LPG) की शुरुआत करते दिखाता प्रसिद्ध कार्टून।' },
            'page_7_img_1.png': { selected: true, part: 'part6', caption: '<b>चित्र:</b> गठबंधन युग के नायक अटल बिहारी वाजपेयी और उनके सहयोगी दलों के नेताओं के साथ मंत्रणा।' },
            'page_10_img_2.png': { selected: true, part: 'part2', caption: '<b>चित्र:</b> 1990 के मंडल आयोग की सिफारिशों के खिलाफ उग्र प्रदर्शन करते छात्र।' },
            'page_11_img_2.png': { selected: true, part: 'part2', caption: '<b>चित्र:</b> मंडल आयोग के अध्यक्ष बिंदेश्वरी प्रसाद मंडल (B.P. Mandal) का डाकटिकट।' },
            'page_12_img_3.png': { selected: true, part: 'part2', caption: '<b>चित्र:</b> बहुजन समाज पार्टी (BSP) के संस्थापक कांशीराम।' },
            'page_15_img_1.png': { selected: true, part: 'part4', caption: '<b>चित्र:</b> अयोध्या विवाद और बाबरी मस्जिद विध्वंस से जुड़ी समकालीन अखबारों की प्रमुख सुर्खियां।' },
            'page_16_img_1.png': { selected: true, part: 'part6', caption: '<b>चित्र:</b> एनडीए (NDA) और यूपीए (UPA) गठबंधनों के चुनावी आंकड़ों का चार्ट।' },
            'page_22_img_1.png': { selected: true, part: 'part7', caption: '<b>चित्र:</b> भारतीय संसद में विभिन्न दशकों में सीटों की राजनैतिक संरचना का विकास चार्ट।' }
        };

        async function init() {
            try {
                const res = await fetch('images/ch15/metadata.json');
                allData = await res.json();
                
                // Initialize selection state
                allData.forEach(item => {
                    const def = defaultMappings[item.filename] || { selected: false, part: 'part1', caption: `<b>चित्र:</b> पेज ${item.page} से प्राप्त NCERT चित्र संख्या ${item.index}।` };
                    selectedState[item.filename] = {
                        selected: def.selected,
                        caption: def.caption,
                        part: def.part
                    };
                });

                // Populate page filter
                const pages = [...new Set(allData.map(item => item.page))].sort((a,b) => a-b);
                const pageFilter = document.getElementById('pageFilter');
                pages.forEach(p => {
                    const opt = document.createElement('option');
                    opt.value = p;
                    opt.textContent = `पेज ${p}`;
                    pageFilter.appendChild(opt);
                });

                renderGrid();
            } catch (err) {
                console.error("Failed to load metadata.json", err);
            }
        }

        function renderGrid() {
            const grid = document.getElementById('imageGrid');
            grid.innerHTML = '';

            const pageFilter = document.getElementById('pageFilter').value;
            const statusFilter = document.getElementById('statusFilter').value;
            const searchTerm = document.getElementById('searchBar').value.toLowerCase();

            allData.forEach(item => {
                const state = selectedState[item.filename];
                
                // Apply filters
                if (pageFilter !== 'all' && item.page != pageFilter) return;
                if (statusFilter === 'selected' && !state.selected) return;
                if (statusFilter === 'unselected' && state.selected) return;
                if (searchTerm && !item.context.toLowerCase().includes(searchTerm)) return;

                const card = document.createElement('div');
                card.className = `card ${state.selected ? 'selected' : ''}`;
                card.id = `card-${item.filename}`;
                card.innerHTML = `
                    <div class="card-header">
                        <span class="card-title">${item.filename}</span>
                        <span class="page-badge">पेज ${item.page}</span>
                    </div>
                    <div class="img-container">
                        <img src="images/ch15/${item.filename}" alt="${item.filename}">
                    </div>
                    <div class="form-group">
                        <label class="checkbox-container">
                            <input type="checkbox" ${state.selected ? 'checked' : ''} onchange="toggleSelect('${item.filename}', this.checked)">
                            नोट्स में शामिल करें (Include)
                        </label>
                    </div>
                    <div class="form-group">
                        <label>नोट्स का भाग (Section):</label>
                        <select onchange="updatePart('${item.filename}', this.value)">
                            <option value="part1" ${state.part === 'part1' ? 'selected' : ''}>भाग 1: कांग्रेस प्रणाली का अंत</option>
                            <option value="part2" ${state.part === 'part2' ? 'selected' : ''}>भाग 2: मंडल आयोग (OBC)</option>
                            <option value="part3" ${state.part === 'part3' ? 'selected' : ''}>भाग 3: नई आर्थिक नीति (1991)</option>
                            <option value="part4" ${state.part === 'part4' ? 'selected' : ''}>भाग 4: अयोध्या विवाद</option>
                            <option value="part5" ${state.part === 'part5' ? 'selected' : ''}>भाग 5: राजीव गांधी हत्या व गठबंधन</option>
                            <option value="part6" ${state.part === 'part6' ? 'selected' : ''}>भाग 6: एनडीए और यूपीए</option>
                            <option value="part7" ${state.part === 'part7' ? 'selected' : ''}>भाग 7: सर्वसम्मति</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>चित्र का विवरण/कैप्शन (Caption in HTML):</label>
                        <textarea oninput="updateCaption('${item.filename}', this.value)">${state.caption}</textarea>
                    </div>
                    <div class="form-group">
                        <label>पेज संदर्भ (NCERT Text Context):</label>
                        <div class="context-box">${item.context || 'नो टेक्स्ट उपलब्ध'}</div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function toggleSelect(filename, checked) {
            selectedState[filename].selected = checked;
            const card = document.getElementById(`card-${filename}`);
            if (card) {
                if (checked) card.classList.add('selected');
                else card.classList.remove('selected');
            }
        }

        function updatePart(filename, part) {
            selectedState[filename].part = part;
        }

        function updateCaption(filename, caption) {
            selectedState[filename].caption = caption;
        }

        function selectAll(checked) {
            allData.forEach(item => {
                selectedState[item.filename].selected = checked;
            });
            renderGrid();
        }

        function applyFilters() {
            renderGrid();
        }

        async function saveSelection() {
            const dataToSave = [];
            for (let filename in selectedState) {
                if (selectedState[filename].selected) {
                    dataToSave.push({
                        filename: filename,
                        part: selectedState[filename].part,
                        caption: selectedState[filename].caption
                    });
                }
            }

            try {
                const res = await fetch('http://localhost:8000/save', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(dataToSave)
                });
                const result = await res.json();
                if (result.status === 'success') {
                    const msg = document.getElementById('statusMessage');
                    msg.style.display = 'block';
                    setTimeout(() => { msg.style.display = 'none'; }, 4000);
                } else {
                    alert('सुरक्षित करने में विफलता: ' + result.error);
                }
            } catch (err) {
                alert('सर्वर से कनेक्ट करने में विफल। कृपया सुनिश्चित करें कि run_selector.py चल रहा है!');
            }
        }

        init();
    </script>
</body>
</html>
